<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام مصعب المتكامل ⚡</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --gold: #ffcf33;
            --primary: #0f172a;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
            --text: #f8fafc;
            --danger: #ef4444;
            --sms-blue: #2563eb;
        }

        .light-theme {
            --primary: #f1f5f9;
            --glass: rgba(255, 255, 255, 0.9);
            --border: rgba(0, 0, 0, 0.05);
            --text: #1e293b;
            --gold: #d97706;
        }

        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; transition: 0.3s; }

        body {
            margin: 0; background: var(--primary); color: var(--text); min-height: 100vh; padding: 15px;
            background-image: radial-gradient(circle at top right, rgba(56, 189, 248, 0.05), transparent);
        }

        .theme-toggle {
            position: fixed; top: 15px; left: 15px; z-index: 1000;
            width: 40px; height: 40px; border-radius: 12px;
            background: var(--glass); border: 1px solid var(--border);
            cursor: pointer; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(10px);
        }

        #login-page { height: 80vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: var(--glass); padding: 30px; border-radius: 24px; border: 1px solid var(--border); width: 320px; text-align: center; }

        #admin-panel { display: none; max-width: 1000px; margin: auto; }

        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }

        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin-bottom: 25px; }

        .card {
            background: var(--glass); backdrop-filter: blur(15px); padding: 18px;
            border-radius: 20px; border: 1px solid var(--border);
        }

        .card h3 { font-size: 15px; margin: 0 0 12px 0; color: var(--gold); border-bottom: 1px solid var(--border); padding-bottom: 5px; }

        input, select {
            width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--border);
            background: rgba(0,0,0,0.2); color: var(--text); font-size: 14px; margin-bottom: 8px; outline: none;
        }

        .btn-main {
            background: linear-gradient(135deg, var(--gold), #fbbf24);
            color: #000; border: none; padding: 12px; border-radius: 10px;
            font-weight: 700; width: 100%; cursor: pointer;
        }

        .btn-warning { background: var(--danger); color: white; border: none; padding: 12px; border-radius: 10px; font-weight: 700; width: 100%; cursor: pointer; margin-top: 5px; }
        .btn-sms { background: var(--sms-blue); color: white; border: none; padding: 12px; border-radius: 10px; font-weight: 700; width: 100%; cursor: pointer; margin-top: 5px; }

        table { width: 100%; border-collapse: collapse; margin-top: 5px; }
        th { color: var(--gold); padding: 10px; text-align: center; font-size: 12px; background: rgba(0,0,0,0.1); }
        td { padding: 10px; text-align: center; border-bottom: 1px solid var(--border); font-size: 13px; cursor: pointer; }

        .modal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px); z-index: 2000; align-items: center; justify-content: center;
        }
        .modal-content { background: var(--primary); border: 1px solid var(--gold); padding: 25px; border-radius: 24px; width: 360px; max-height: 95vh; overflow-y: auto; }
        label { font-size: 12px; display: block; margin-bottom: 4px; opacity: 0.8; }
    </style>
</head>
<body class="dark-theme">

    <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙</button>

    <div id="login-page">
        <div class="login-card">
            <h2 style="color:var(--gold); margin-bottom: 20px;">⚡ نظام مصعب</h2>
            <input type="text" id="user" placeholder="اسم المستخدم">
            <input type="password" id="pass" placeholder="كلمة المرور">
            <button class="btn-main" onclick="login()">دخول</button>
        </div>
    </div>

    <div id="admin-panel">
        <div class="header-top">
            <h3 style="margin:0; color:var(--gold)">أهلاً مصعب 👋</h3>
            <button onclick="logout()" style="background:none; border:1px solid var(--danger); color:var(--danger); padding:5px 10px; border-radius:8px; cursor:pointer; font-size:12px;">تسجيل الخروج</button>
        </div>

        <div class="grid-container">
            <div class="card">
                <h3>⚙️ سعر الكيلو</h3>
                <input type="number" id="price" step="0.1" oninput="savePrice(); calculate()" placeholder="مثال: 0.5">
            </div>
            <div class="card">
                <h3>👤 إضافة مشترك</h3>
                <input type="text" id="name" placeholder="الاسم">
                <input type="tel" id="phone" placeholder="رقم الهاتف">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                    <input type="number" id="prev" placeholder="السابقة" oninput="calculate()">
                    <input type="number" id="curr" placeholder="الحالية" oninput="calculate()">
                </div>
                <div style="text-align: center; margin: 10px 0;">
                   المبلغ: <span id="total-val" style="color:var(--gold); font-weight:900; font-size:18px;">0.00</span>
                </div>
                <button class="btn-main" onclick="saveRecord()">حفظ وإرسال الفاتورة ✅</button>
            </div>
        </div>

        <div class="card">
            <h3>📊 البحث والسجل (اضغط للتعديل)</h3>
            <input type="text" id="searchInput" placeholder="ابحث باسم المشترك..." onkeyup="filterTable()" style="border: 1.5px solid var(--gold);">
            <div style="overflow-x: auto;">
                <table id="recordsTable">
                    <thead>
                        <tr><th>الاسم</th><th>س / ح</th><th>المبلغ</th><th>الحالة</th><th>حذف</th></tr>
                    </thead>
                    <tbody id="history-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="editModal" class="modal">
        <div class="modal-content">
            <h3 style="color:var(--gold); margin-top:0; text-align:center;">إدارة بيانات المشترك</h3>
            <input type="hidden" id="editIdx">
            
            <label>اسم المشترك:</label><input type="text" id="editName">
            <label>رقم الهاتف:</label><input type="tel" id="editPhone">
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div><label>السابقة:</label><input type="number" id="editPrev" oninput="reCalcEdit()"></div>
                <div><label>الحالية:</label><input type="number" id="editCurr" oninput="reCalcEdit()"></div>
            </div>

            <label>المبلغ المستحق (تلقائي):</label>
            <input type="text" id="editTotal" readonly style="background:rgba(255,255,255,0.05); color:var(--gold); font-weight:bold;">

            <label>حالة الدفع:</label>
            <select id="editStatus">
                <option value="pending">⏳ انتظار</option>
                <option value="paid">✅ تم التسديد</option>
            </select>
            
            <div style="margin-top: 15px; border-top: 1px solid var(--border); padding-top: 15px;">
                <button class="btn-main" onclick="updateRecord()">حفظ التعديلات</button>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px;">
                    <button class="btn-warning" onclick="sendWarning()">⚠️ واتساب</button>
                    <button class="btn-sms" onclick="sendSMSWarning()">💬 SMS</button>
                </div>
                <button class="btn-main" style="background:none; color:var(--text); border:1px solid var(--border); margin-top:10px;" onclick="closeModal()">إغلاق</button>
            </div>
        </div>
    </div>

    <script>
        function toggleTheme() {
            document.body.classList.toggle('light-theme');
            const isLight = document.body.classList.contains('light-theme');
            document.getElementById('themeBtn').innerText = isLight ? '☀️' : '🌙';
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
        }

        function login() {
            if (document.getElementById('user').value === 'mosab' && document.getElementById('pass').value === '272007') {
                document.getElementById('login-page').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'block';
                loadHistory();
            } else { Swal.fire('خطأ', 'بيانات غير صحيحة', 'error'); }
        }

        function logout() {
            document.getElementById('login-page').style.display = 'flex';
            document.getElementById('admin-panel').style.display = 'none';
        }

        function calculate() {
            const p = parseFloat(document.getElementById('prev').value) || 0;
            const c = parseFloat(document.getElementById('curr').value) || 0;
            const price = parseFloat(document.getElementById('price').value) || 0.5;
            document.getElementById('total-val').innerText = ((c - p) * price).toFixed(2);
        }

        function reCalcEdit() {
            const p = parseFloat(document.getElementById('editPrev').value) || 0;
            const c = parseFloat(document.getElementById('editCurr').value) || 0;
            const price = parseFloat(document.getElementById('price').value) || 0.5;
            document.getElementById('editTotal').value = ((c - p) * price).toFixed(2);
        }

        function saveRecord() {
            const name = document.getElementById('name').value, phone = document.getElementById('phone').value;
            const prev = document.getElementById('prev').value, curr = document.getElementById('curr').value;
            const total = document.getElementById('total-val').innerText;
            if(!name || !curr) return Swal.fire('تنبيه', 'أكمل البيانات', 'info');
            
            const history = JSON.parse(localStorage.getItem('elec_records') || '[]');
            history.push({ name, phone, prev, curr, total, status: 'pending' });
            localStorage.setItem('elec_records', JSON.stringify(history));
            loadHistory();
            
            // --- الرسالة المطلوبة من مصعب ---
            const diff = (parseFloat(curr) - parseFloat(prev)).toFixed(2);
            const msg = `فاتورة كهرباء للمشترك: ${name}
س/ ${prev}
ح/ ${curr}
الفرق/ ${diff} كيلو وات
مستحق/ ${total} شيكل
تحويل بال باي: 0597034313`;
            
            window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank');
            Swal.fire('تم!', 'تم الحفظ وإرسال الفاتورة', 'success');
            // تنظيف الحقول بعد الحفظ
            document.getElementById('name').value = ''; document.getElementById('phone').value = '';
            document.getElementById('prev').value = ''; document.getElementById('curr').value = '';
            document.getElementById('total-val').innerText = '0.00';
        }

        function loadHistory() {
            const history = JSON.parse(localStorage.getItem('elec_records') || '[]');
            const body = document.getElementById('history-body');
            body.innerHTML = '';
            history.slice().reverse().forEach((r, idx) => {
                const actualIdx = history.length - 1 - idx;
                const color = r.status === 'paid' ? '#27ae60' : '#f39c12';
                body.innerHTML += `<tr>
                    <td onclick="openEdit(${actualIdx})"><b>${r.name}</b></td>
                    <td onclick="openEdit(${actualIdx})">${r.prev}/${r.curr}</td>
                    <td onclick="openEdit(${actualIdx})" style="color:var(--gold)">${r.total}</td>
                    <td onclick="openEdit(${actualIdx})" style="color:${color}">${r.status === 'paid' ? 'مدفوع' : 'انتظار'}</td>
                    <td><button onclick="deleteRecord(${actualIdx})" style="background:none; border:none; color:var(--danger); cursor:pointer; font-size:16px;">🗑️</button></td>
                </tr>`;
            });
        }

        function openEdit(idx) {
            const r = JSON.parse(localStorage.getItem('elec_records'))[idx];
            document.getElementById('editIdx').value = idx;
            document.getElementById('editName').value = r.name;
            document.getElementById('editPhone').value = r.phone;
            document.getElementById('editPrev').value = r.prev;
            document.getElementById('editCurr').value = r.curr;
            document.getElementById('editTotal').value = r.total;
            document.getElementById('editStatus').value = r.status;
            document.getElementById('editModal').style.display = 'flex';
        }

        function updateRecord() {
            const idx = document.getElementById('editIdx').value;
            let history = JSON.parse(localStorage.getItem('elec_records'));
            history[idx] = { 
                name: document.getElementById('editName').value,
                phone: document.getElementById('editPhone').value,
                prev: document.getElementById('editPrev').value,
                curr: document.getElementById('editCurr').value,
                total: document.getElementById('editTotal').value,
                status: document.getElementById('editStatus').value
            };
            localStorage.setItem('elec_records', JSON.stringify(history));
            loadHistory(); closeModal(); Swal.fire('تم!', 'تم تحديث البيانات', 'success');
        }

        function deleteRecord(idx) {
            Swal.fire({ title: 'حذف المشترك؟', icon: 'warning', showCancelButton: true, confirmButtonText: 'حذف', cancelButtonText: 'إلغاء' }).then(res => {
                if(res.isConfirmed) {
                    let h = JSON.parse(localStorage.getItem('elec_records'));
                    h.splice(idx, 1);
                    localStorage.setItem('elec_records', JSON.stringify(h));
                    loadHistory();
                }
            });
        }

        function sendWarning() {
            const n = document.getElementById('editName').value, ph = document.getElementById('editPhone').value, t = document.getElementById('editTotal').value;
            const msg = `تذكير سداد للمشترك: ${n}\nالمبلغ المستحق: ${t} شيكل\nيرجى السداد لتجنب الفصل.`;
            window.open(`https://wa.me/${ph}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        function sendSMSWarning() {
            window.location.href = `sms:${document.getElementById('editPhone').value}?body=يرجى سداد فاتورة الكهرباء`;
        }

        function closeModal() { document.getElementById('editModal').style.display = 'none'; }
        function savePrice() { localStorage.setItem('elec_price', document.getElementById('price').value); }
        function filterTable() {
            const filter = document.getElementById("searchInput").value.toLowerCase();
            document.querySelectorAll("#recordsTable tbody tr").forEach(tr => tr.style.display = tr.innerText.toLowerCase().includes(filter) ? "" : "none");
        }
        window.onload = () => { 
            if(localStorage.getItem('theme') === 'light') toggleTheme(); 
            document.getElementById('price').value = localStorage.getItem('elec_price') || 0.5;
        };
    </script>
</body>
</html>
